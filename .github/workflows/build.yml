name: Build ASTRA APK (ARM64 + local Qwen)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/local-qwen-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android native toolchain
        run: |
          sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Fetch pinned llama.cpp source
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout fc504f91d8cfdfcd9b0fedcf14600fd2b0e63420
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build ARM64 debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: astra-local-qwen-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
