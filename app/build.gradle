plugins { id 'com.android.application' }

android {
    namespace 'com.astra.loremotionbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.astra.loremotionbridge'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
