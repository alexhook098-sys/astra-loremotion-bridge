plugins { id 'com.android.application' }

android {
    namespace 'com.astra.loremotionbridge'
    compileSdk 35
    ndkVersion '29.0.13113456'

    defaultConfig {
        applicationId 'com.astra.loremotionbridge'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-qwen'

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
                arguments '-DANDROID_STL=c++_shared',
                          '-DLLAMA_BUILD_TESTS=OFF',
                          '-DLLAMA_BUILD_EXAMPLES=OFF',
                          '-DLLAMA_BUILD_SERVER=OFF',
                          '-DLLAMA_BUILD_TOOLS=OFF',
                          '-DGGML_OPENMP=OFF',
                          '-DGGML_NATIVE=OFF',
                          '-DGGML_BACKEND_DL=ON',
                          '-DGGML_CPU_ALL_VARIANTS=ON',
                          '-DGGML_LLAMAFILE=OFF',
                          '-DLLAMA_OPENSSL=OFF'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main { jniLibs.srcDirs = ['src/main/jniLibs'] }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.18.0'

    // AndroidX Media3 — commercial-friendly editing/export foundation (Apache-2.0).
    // Keep all Media3 modules on the exact same version.
    def media3Version = '1.11.1'
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
}
